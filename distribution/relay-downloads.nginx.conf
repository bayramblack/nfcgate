server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relay.undernet.work;
    root /var/www/undernet-downloads;
    ssl_certificate /etc/letsencrypt/live/relay.undernet.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.undernet.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location = / { return 302 /downloads/UnderNet-latest.apk; }
    location = /downloads/latest.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /downloads/UnderNet-latest.apk {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location /downloads/ {
        autoindex off;
        try_files $uri =404;
    }
    location / { return 404; }
}
